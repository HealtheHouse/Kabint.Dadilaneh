<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<title>مدیریت مالی برادران دادیلانه</title>

<style>
:root{--bg:#f3f6fb;--surface:#fff;--surface2:#f8fafc;--ink:#172033;--muted:#667085;--primary:#1f5eff;--primary2:#1749c6;--primarySoft:#eaf0ff;--line:#e4e9f2;--danger:#d92d20;--dangerSoft:#fff1f0;--warning:#b54708;--warningSoft:#fff6ed;--success:#027a48;--successSoft:#ecfdf3;--shadow:0 10px 30px rgba(16,24,40,.06);--radius:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn",Arial,sans-serif;font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:68px;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brandWrap{display:flex;align-items:center;gap:12px}.brandIcon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1f5eff,#5b8cff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;box-shadow:0 7px 18px rgba(31,94,255,.25)}.brand{font-weight:900;font-size:15px}.status{font-size:11px;color:var(--muted)}.topUser{display:flex;align-items:center;gap:10px}.userPill{background:var(--surface2);border:1px solid var(--line);padding:7px 10px;border-radius:9px;color:#475467}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 68px)}.side{background:#101828;color:#fff;padding:18px 13px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.sideTitle{font-size:10px;color:#98a2b3;padding:12px 10px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:right;padding:11px 12px;border-radius:10px;color:#d0d5dd;display:flex;align-items:center;gap:9px}.nav button:before{content:'•';color:#667085;font-size:16px}.nav button:hover,.nav button.active{background:#1d2939;color:#fff}.nav button.active:before{color:#84adff}.sideFooter{margin-top:22px;padding:12px 10px;border-top:1px solid #344054;color:#98a2b3;font-size:10px;line-height:1.8}.main{padding:24px;max-width:1700px;width:100%;margin:auto}.pageHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.pageHead h1{margin:0;font-size:22px}.pageHead p{margin:6px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:17px;position:relative;overflow:hidden}.card:after{content:'';position:absolute;left:-18px;bottom:-30px;width:80px;height:80px;border-radius:50%;background:var(--primarySoft)}.card .label{font-size:11px;color:var(--muted);position:relative;z-index:1}.value{font-size:21px;font-weight:900;margin-top:8px;position:relative;z-index:1}.panel{padding:17px;margin-bottom:16px}.panel h2{font-size:15px;margin:0 0 14px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.btn{border:1px solid transparent;background:var(--primary);color:#fff;padding:9px 13px;border-radius:9px;font-weight:700;box-shadow:0 3px 8px rgba(31,94,255,.14)}.btn:hover{background:var(--primary2)}.btn.light{background:#fff;color:#344054;border-color:var(--line);box-shadow:none}.btn.light:hover{background:var(--surface2)}.btn.danger{background:var(--dangerSoft);color:#b42318;border-color:#fecdca;box-shadow:none}.btn.warn{background:var(--warningSoft);color:#b54708;border-color:#fedf89;box-shadow:none}.btn.small{padding:6px 9px;font-size:11px;border-radius:7px}.input,.select,.filter{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;outline:none;transition:.15s}.input:focus,.select:focus,.filter:focus{border-color:#84adff;box-shadow:0 0 0 3px #eaf0ff}.grow{flex:1;min-width:220px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#475467;font-weight:700}.actions{display:flex;gap:8px;justify-content:flex-start;align-items:center}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:separate;border-spacing:0;min-width:850px;background:#fff}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap;text-align:right;font-size:11px}.table th{background:#f8fafc;position:sticky;top:0;z-index:2;color:#344054}.table tbody tr:hover{background:#f8fbff}.table tbody tr:last-child td{border-bottom:0}.thbtn{border:0;background:transparent;font-weight:800;color:#344054;padding:0}.filter-row th{top:36px;background:#fff}.filter{width:100%;min-width:90px;padding:5px;font-size:10px}.empty{text-align:center;color:var(--muted);padding:30px}.modal{position:fixed;inset:0;background:rgba(16,24,40,.52);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:17px;max-width:980px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 25px 70px rgba(16,24,40,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:#f2f4f7;color:#344054;border-radius:8px;padding:7px 10px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#eaf0ff,transparent 30%),var(--bg)}.loginbox{max-width:450px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 25px 70px rgba(16,24,40,.10)}.loginLogo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#1f5eff,#5b8cff);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;margin-bottom:15px}.loginbox h1{font-size:22px;margin:0 0 8px}.notice{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:10px;color:#475467;font-size:12px;line-height:1.9}.toast{position:fixed;left:20px;bottom:20px;background:#101828;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:100;box-shadow:0 10px 25px rgba(16,24,40,.2)}.toast.show{display:block}.hidden{display:none!important}.tabs{display:flex;gap:6px;margin-bottom:12px;background:#f2f4f7;padding:4px;border-radius:10px;width:max-content}.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 13px;color:#667085}.tabs button.active{background:#fff;color:var(--primary);font-weight:800;box-shadow:0 2px 7px rgba(16,24,40,.07)}.metricIcon{font-size:20px;margin-bottom:9px}.subtle{color:var(--muted)}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{font-size:11px;padding:9px}.sideTitle,.sideFooter{display:none}.main{padding:14px}.top{position:static}.grid2{grid-template-columns:1fr}}@media(max-width:620px){.nav{grid-template-columns:repeat(2,1fr)}.top{height:auto;align-items:flex-start}.topUser{flex-direction:column;align-items:flex-end}.main{padding:10px}.pageHead{flex-direction:column}.cards{grid-template-columns:1fr 1fr}.card{padding:13px}.value{font-size:17px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><strong id="modalTitle"></strong><button class="close" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script>
const C=window.APP_CONFIG||{};
let client=null, session=null;
let DB={accounts:[],groups:[],abouts:[],transactions:[],checks_received:[],checks_outgoing:[],contacts:[]};
let current='dashboard', checksTab='outgoing';
const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const checkStatuses=['فعال','پاس شد','برگشت داده شد','برگشتی','مربوط به سال بعد','خرج شده','خرج نشده'];
const sayadStatuses=['چک ثبت شده','چک ثبت نشده','چک قدیمی','فاقد چک'];
const txTypes=['دریافت','پرداخت','انتقال'];
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const num=n=>Number(n||0).toLocaleString('fa-IR');
const money=n=>num(n)+' ریال';
const val=id=>document.getElementById(id)?.value??'';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function field(label,id,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input class="input" id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,id,options,value=''){return `<div class="field"><label>${label}</label><select class="select" id="${id}">${options.map(o=>`<option value="${esc(o)}" ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function nav(){return `<aside class="side"><div class="sideTitle">منوی اصلی</div><div class="nav">${[['dashboard','داشبورد'],['transactions','ثبت تراکنش'],['checks','چک'],['accounts','حساب‌ها'],['groups','گروه‌ها و بابت'],['contacts','مخاطبین'],['reports','گزارش‌ها'],['settings','تنظیمات']].map(([k,t])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</div><div class="sideFooter">نسخه آنلاین<br>قابل استفاده از چند رایانه با یک پایگاه داده مرکزی</div></aside>`}
function shell(content){document.getElementById('app').innerHTML=`<header class="top"><div class="brandWrap"><div class="brandIcon">د</div><div><div class="brand">نرم‌افزار مدیریت مالی برادران دادیلانه</div><div class="status">سامانه مالی آنلاین · اطلاعات در دیتابیس مرکزی</div></div></div><div class="topUser"><span class="userPill">${esc(session?.user?.email||'کاربر')}</span><button class="btn light" onclick="logout()">خروج</button></div></header><div class="layout">${nav()}<main class="main" id="content">${content}</main></div>`}
function go(k){current=k;render()}
function render(){if(!session)return renderLogin(); if(current==='dashboard')dashboard(); else if(current==='transactions')transactions(); else if(current==='checks')checks(); else if(current==='accounts')accounts(); else if(current==='groups')groupsAbout(); else if(current==='contacts')contacts(); else if(current==='reports')reports(); else settings()}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginLogo">د</div><h1>ورود به نرم‌افزار مالی دادیلانه</h1><p class="notice">اطلاعات مالی در مرورگر ذخیره نمی‌شود و از دیتابیس آنلاین خوانده می‌شود. برای دسترسی باید حساب کاربری Supabase داشته باشید.</p><div class="form" style="margin-top:14px">${field('ایمیل','login_email','','email')}${field('رمز عبور','login_pass','','password')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="login()">ورود</button></div><p id="loginMsg" class="status" style="margin-top:10px"></p></div></div>`}
async function login(){const msg=document.getElementById('loginMsg');msg.textContent='در حال ورود...';const {error}=await client.auth.signInWithPassword({email:val('login_email'),password:val('login_pass')});if(error){msg.textContent=error.message;return}toast('ورود موفق بود')}
async function logout(){await client.auth.signOut()}
async function loadAll(){const tables=Object.keys(DB);const res=await Promise.all(tables.map(t=>client.from(t).select('*')));for(let i=0;i<tables.length;i++){if(res[i].error)throw res[i].error;DB[tables[i]]=res[i].data||[]}}
async function save(table,id,payload){let q;if(id){q=client.from(table).update(payload).eq('id',id)}else{q=client.from(table).insert(payload)}const {error}=await q;if(error){toast(error.message);throw error}await loadAll();render()}
async function remove(table,id){if(!confirm('این مورد حذف شود؟'))return;const {error}=await client.from(table).delete().eq('id',id);if(error){toast(error.message);return}await loadAll();render();toast('حذف شد')}
function dashboard(){const inc=DB.transactions.filter(x=>x.tx_type==='دریافت').reduce((a,x)=>a+Number(x.amount||0),0),out=DB.transactions.filter(x=>x.tx_type==='پرداخت').reduce((a,x)=>a+Number(x.amount||0),0);const activeOut=DB.checks_outgoing.filter(x=>x.status==='فعال').reduce((a,x)=>a+Number(x.amount||0),0),activeIn=DB.checks_received.filter(x=>x.status==='فعال').reduce((a,x)=>a+Number(x.amount||0),0);shell(`<h1>داشبورد</h1><div class="cards"><div class="card"><div class="label">مجموع دریافت</div><div class="value">${money(inc)}</div></div><div class="card"><div class="label">مجموع پرداخت</div><div class="value">${money(out)}</div></div><div class="card"><div class="label">چک صادره فعال</div><div class="value">${money(activeOut)}</div></div><div class="card"><div class="label">چک دریافتی فعال</div><div class="value">${money(activeIn)}</div></div><div class="card"><div class="label">تعداد تراکنش</div><div class="value">${num(DB.transactions.length)}</div></div></div><div class="panel" style="margin-top:16px"><h2>آخرین تراکنش‌ها</h2>${table('dash_tx',['تاریخ','نوع','بابت','مبلغ','دریافت‌کننده','پرداخت‌کننده'],DB.transactions.slice().reverse().slice(0,10).map(x=>[x.tx_date,x.tx_type,x.about,money(x.amount),x.receiver,x.payer]),null,{filters:false,sort:false})}</div>`)}
function table(key,heads,rows,actions,opts={}){let data=rows.map((r,i)=>({r,i}));if(!data.length)return `<div class="empty">رکوردی یافت نشد.</div>`;const f=opts.filters!==false,s=opts.sort!==false;let id='tbl_'+key;window.__tables=window.__tables||{};window.__tables[id]={heads,rows,actions,filters:Array(heads.length).fill(''),sortCol:null,dir:1,render:()=>renderTable(id)};return renderTable(id)}
function renderTable(id){const t=window.__tables[id];let data=t.rows.map((r,i)=>({r,i}));t.filters.forEach((f,c)=>{if(f)data=data.filter(o=>String(o.r[c]??'').toLowerCase().includes(f.toLowerCase()))});if(t.sortCol!==null){const c=t.sortCol;data.sort((a,b)=>{const av=a.r[c],bv=b.r[c];const an=Number(String(av).replace(/[^\d.-]/g,'')),bn=Number(String(bv).replace(/[^\d.-]/g,''));let z=(Number.isFinite(an)&&Number.isFinite(bn)&&String(av).trim()!==''&&String(bv).trim()!=='')?an-bn:String(av??'').localeCompare(String(bv??''),'fa');return z*t.dir})}let h='<div class="table-wrap"><table class="table"><thead><tr>'+t.heads.map((x,c)=>`<th><button class="thbtn" onclick="sortTable('${id}',${c})">${esc(x)} ${t.sortCol===c?(t.dir===1?'▲':'▼'):''}</button></th>`).join('')+(t.actions?'<th>عملیات</th>':'')+'</tr><tr class="filter-row">'+t.heads.map((x,c)=>`<th><input class="filter" placeholder="فیلتر" value="${esc(t.filters[c])}" oninput="filterTable('${id}',${c},this.value)"></th>`).join('')+(t.actions?'<th></th>':'')+'</tr></thead><tbody>';h+=data.map(o=>'<tr>'+o.r.map(v=>`<td>${esc(v)}</td>`).join('')+(t.actions?`<td>${t.actions(o.r,o.i)}</td>`:'')+'</tr>').join('');return h+'</tbody></table></div>'}
function sortTable(id,c){const t=window.__tables[id];t.dir=t.sortCol===c?-t.dir:1;t.sortCol=c;rerenderTable(id)}function filterTable(id,c,v){window.__tables[id].filters[c]=v;rerenderTable(id)}function rerenderTable(id){const e=document.getElementById(id);if(e)e.outerHTML=renderTable(id)}
function transactions(){const rows=DB.transactions.map(x=>[x.id,x.tx_date,x.tx_type,x.about,money(x.amount),x.receiver,x.payer,x.note]);const html=`<h1>ثبت تراکنش</h1><div class="panel"><div class="toolbar"><button class="btn" onclick="txForm()">+ ثبت تراکنش</button><span class="status">برای فیلتر، زیر هر ستون عبارت موردنظر را وارد کنید؛ برای مرتب‌سازی روی عنوان ستون بزنید.</span></div>${table('transactions',['شناسه','تاریخ','نوع','بابت','مبلغ','دریافت‌کننده','پرداخت‌کننده','توضیحات'],rows,(r)=>`<button class="btn light small" onclick="txForm('${r[0]}')">ویرایش</button> <button class="btn danger small" onclick="remove('transactions','${r[0]}')">حذف</button>`)}</div>`;shell(html)}
function txForm(id=null){const x=id?DB.transactions.find(z=>z.id===id):{};openModal(id?'ویرایش تراکنش':'ثبت تراکنش',`<div class="form">${field('تاریخ','tx_date',x.tx_date||'1405/01/01')}${selectField('نوع تراکنش','tx_type',txTypes,x.tx_type||'دریافت')}${field('گروه/بابت','tx_about',x.about||'')}${field('مبلغ','tx_amount',x.amount||0,'number')}${field('دریافت‌کننده','tx_receiver',x.receiver||'')}${field('پرداخت‌کننده','tx_payer',x.payer||'')}${field('توضیحات','tx_note',x.note||'')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveTx('${id||''}')">ذخیره</button></div>`)}
async function saveTx(id){const p={tx_date:val('tx_date'),tx_type:val('tx_type'),about:val('tx_about'),amount:Number(val('tx_amount')||0),receiver:val('tx_receiver'),payer:val('tx_payer'),note:val('tx_note')};if(!p.tx_date||!p.amount)return toast('تاریخ و مبلغ الزامی است');closeModal();await save('transactions',id||null,p);toast('تراکنش ذخیره شد')}
function checks(){const out=DB.checks_outgoing.map(x=>[x.id,x.tx_date,x.month,money(x.amount),x.payee,x.national_id,x.phone,x.sayad,x.bank,x.status]);const inc=DB.checks_received.map(x=>[x.id,x.row_no,x.assignor,x.bank,x.due_date,x.month,money(x.amount),x.sayad,x.sayad_status,x.status,x.receiver,x.transferred_amount?money(x.transferred_amount):'',x.transfer_status]);const body=checksTab==='outgoing'?`<div class="toolbar"><button class="btn" onclick="outForm()">+ چک صادرشده</button></div>${table('outchecks',['شناسه','تاریخ','ماه','مبلغ','گیرنده','کد ملی','تماس','صیاد','بانک','وضعیت'],out,(r)=>`<button class="btn light small" onclick="outForm('${r[0]}')">ویرایش</button> <button class="btn danger small" onclick="remove('checks_outgoing','${r[0]}')">حذف</button>`)}`:`<div class="toolbar"><button class="btn" onclick="inForm()">+ چک دریافتی</button></div>${table('inchecks',['شناسه','ردیف','واگذارکننده','بانک','سررسید','ماه','مبلغ','صیاد','وضعیت صیاد','وضعیت چک','گیرنده','مبلغ واگذاری','وضعیت واگذاری'],inc,(r)=>`<button class="btn light small" onclick="inForm('${r[0]}')">ویرایش</button> <button class="btn danger small" onclick="remove('checks_received','${r[0]}')">حذف</button>`)}`;shell(`<h1>چک</h1><div class="tabs"><button class="${checksTab==='outgoing'?'active':''}" onclick="checksTab='outgoing';checks()">چک‌های صادرشده</button><button class="${checksTab==='incoming'?'active':''}" onclick="checksTab='incoming';checks()">چک‌های دریافتی</button></div><div class="panel">${body}</div>`)}
function outForm(id=null){const x=id?DB.checks_outgoing.find(z=>z.id===id):{};openModal(id?'ویرایش چک صادرشده':'ثبت چک صادرشده',`<div class="form">${field('تاریخ','o_date',x.tx_date||'')}${selectField('ماه','o_month',months,x.month||'فروردین')}${field('مبلغ','o_amount',x.amount||0,'number')}${field('گیرنده','o_payee',x.payee||'')}${field('کد ملی','o_national',x.national_id||'')}${field('تماس','o_phone',x.phone||'')}${field('شماره صیاد','o_sayad',x.sayad||'')}${field('بانک','o_bank',x.bank||'')}${selectField('وضعیت','o_status',checkStatuses,x.status||'فعال')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveOut('${id||''}')">ذخیره</button></div>`)}
async function saveOut(id){const p={tx_date:val('o_date'),month:val('o_month'),amount:Number(val('o_amount')||0),payee:val('o_payee'),national_id:val('o_national'),phone:val('o_phone'),sayad:val('o_sayad'),bank:val('o_bank'),status:val('o_status')};closeModal();await save('checks_outgoing',id||null,p);toast('چک صادرشده ذخیره شد')}
function inForm(id=null){const x=id?DB.checks_received.find(z=>z.id===id):{};openModal(id?'ویرایش چک دریافتی':'ثبت چک دریافتی',`<div class="form">${field('ردیف دفتر','i_no',x.row_no||'')}${field('واگذارکننده','i_from',x.assignor||'')}${field('بانک','i_bank',x.bank||'')}${field('شعبه','i_branch',x.branch||'')}${field('شماره سند','i_doc',x.doc_no||'')}${field('شماره حساب','i_account',x.account_no||'')}${field('سررسید','i_due',x.due_date||'')}${selectField('ماه','i_month',months,x.month||'فروردین')}${field('مبلغ','i_amount',x.amount||0,'number')}${field('شماره صیاد','i_sayad',x.sayad||'')}${selectField('وضعیت سامانه صیاد','i_sayadstatus',sayadStatuses,x.sayad_status||'فاقد چک')}${selectField('وضعیت چک','i_status',checkStatuses,x.status||'فعال')}${field('کارکرده برای منزل','i_home',x.home_use||'')}${field('نام گیرنده','i_receiver',x.receiver||'')}${field('مبلغ واگذارشده','i_transferamount',x.transferred_amount||0,'number')}${field('وضعیت واگذاری','i_transferstatus',x.transfer_status||'')}${field('صندوق بانک','i_bankbox',x.bank_box||'')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveIn('${id||''}')">ذخیره</button></div>`)}
async function saveIn(id){const p={row_no:val('i_no'),assignor:val('i_from'),bank:val('i_bank'),branch:val('i_branch'),doc_no:val('i_doc'),account_no:val('i_account'),due_date:val('i_due'),month:val('i_month'),amount:Number(val('i_amount')||0),sayad:val('i_sayad'),sayad_status:val('i_sayadstatus'),status:val('i_status'),home_use:val('i_home'),receiver:val('i_receiver'),transferred_amount:Number(val('i_transferamount')||0),transfer_status:val('i_transferstatus'),bank_box:val('i_bankbox')};closeModal();await save('checks_received',id||null,p);toast('چک دریافتی ذخیره شد')}
function accounts(){const rows=DB.accounts.map(x=>[x.id,x.name,x.type,money(x.initial_balance),x.initial_status,x.phone,x.notes]);shell(`<h1>حساب‌ها</h1><div class="panel"><div class="toolbar"><button class="btn" onclick="accountForm()">+ حساب جدید</button></div>${table('accounts',['کد','نام حساب','نوع','مانده اولیه','وضعیت اولیه','تلفن','یادداشت'],rows,(r)=>`<button class="btn light small" onclick="accountForm(${r[0]})">ویرایش</button> <button class="btn danger small" onclick="remove('accounts',${r[0]})">حذف</button>`)}</div>`)}
function accountForm(id=null){const x=id?DB.accounts.find(z=>z.id==id):{};openModal(id?'ویرایش حساب':'حساب جدید',`<div class="form">${field('نام حساب','a_name',x.name||'')}${selectField('نوع حساب','a_type',['حساب بانکی','حساب نقدی','عمومی','افراد خانواده'],x.type||'عمومی')}${field('مانده اولیه','a_balance',x.initial_balance||0,'number')}${selectField('وضعیت اولیه','a_status',['مثبت-بدهکار','منفی-بستانکار'],x.initial_status||'مثبت-بدهکار')}${field('تلفن','a_phone',x.phone||'')}${field('یادداشت','a_notes',x.notes||'')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveAccount(${id||'null'})">ذخیره</button></div>`)}
async function saveAccount(id){const p={name:val('a_name'),type:val('a_type'),initial_balance:Number(val('a_balance')||0),initial_status:val('a_status'),phone:val('a_phone'),notes:val('a_notes')};if(!p.name)return toast('نام حساب الزامی است');closeModal();await save('accounts',id,p);toast('حساب ذخیره شد')}
function groupsAbout(){const gs=DB.groups.map(x=>[x.id,x.name,x.type]);const bs=DB.abouts.map(x=>[x.id,x.parent,x.description,x.full_name]);shell(`<h1>گروه‌ها و بابت</h1><div class="grid2"><div class="panel"><div class="toolbar"><button class="btn" onclick="groupForm()">+ گروه</button></div>${table('groups',['کد','نام گروه','نوع'],gs,(r)=>`<button class="btn light small" onclick="groupForm(${r[0]})">ویرایش</button> <button class="btn danger small" onclick="remove('groups',${r[0]})">حذف</button>`)}</div><div class="panel"><div class="toolbar"><button class="btn" onclick="aboutForm()">+ بابت</button></div>${table('abouts',['کد','متعلق به','شرح بابت','گروه/بابت'],bs,(r)=>`<button class="btn light small" onclick="aboutForm(${r[0]})">ویرایش</button> <button class="btn danger small" onclick="remove('abouts',${r[0]})">حذف</button>`)}</div></div>`)}
function groupForm(id=null){const x=id?DB.groups.find(z=>z.id==id):{};openModal(id?'ویرایش گروه':'گروه جدید',`<div class="form">${field('نام گروه','g_name',x.name||'')}${selectField('نوع','g_type',['هزینه','درآمد'],x.type||'هزینه')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveGroup(${id||'null'})">ذخیره</button></div>`)}
async function saveGroup(id){const p={name:val('g_name'),type:val('g_type')};if(!p.name)return toast('نام گروه الزامی است');closeModal();await save('groups',id,p);toast('گروه ذخیره شد')}
function aboutForm(id=null){const x=id?DB.abouts.find(z=>z.id==id):{};openModal(id?'ویرایش بابت':'بابت جدید',`<div class="form">${field('متعلق به','b_parent',x.parent||'')}${field('شرح بابت','b_desc',x.description||'')}${field('گروه/بابت کامل','b_full',x.full_name||'')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveAbout(${id||'null'})">ذخیره</button></div>`)}
async function saveAbout(id){const p={parent:val('b_parent'),description:val('b_desc'),full_name:val('b_full')};closeModal();await save('abouts',id,p);toast('بابت ذخیره شد')}
function contacts(){const rows=DB.contacts.map(x=>[x.id,x.name,x.phone,x.national_id,x.eitaa,x.robika,x.soroush,x.bale]);shell(`<h1>مخاطبین</h1><div class="panel"><div class="toolbar"><button class="btn" onclick="contactForm()">+ مخاطب</button></div>${table('contacts',['کد','نام','تلفن','کد ملی','ایتا','روبیکا','سروش','بله'],rows,(r)=>`<button class="btn light small" onclick="contactForm(${r[0]})">ویرایش</button> <button class="btn danger small" onclick="remove('contacts',${r[0]})">حذف</button>`)}</div>`)}
function contactForm(id=null){const x=id?DB.contacts.find(z=>z.id==id):{};openModal(id?'ویرایش مخاطب':'مخاطب جدید',`<div class="form">${field('نام','c_name',x.name||'')}${field('تلفن','c_phone',x.phone||'')}${field('کد ملی','c_national',x.national_id||'')}${field('ایتا','c_eitaa',x.eitaa||'')}${field('روبیکا','c_robika',x.robika||'')}${field('سروش','c_soroush',x.soroush||'')}${field('بله','c_bale',x.bale||'')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveContact(${id||'null'})">ذخیره</button></div>`)}
async function saveContact(id){const p={name:val('c_name'),phone:val('c_phone'),national_id:val('c_national'),eitaa:val('c_eitaa'),robika:val('c_robika'),soroush:val('c_soroush'),bale:val('c_bale')};if(!p.name)return toast('نام الزامی است');closeModal();await save('contacts',id,p);toast('مخاطب ذخیره شد')}
function reports(){const inc=DB.transactions.filter(x=>x.tx_type==='دریافت').reduce((a,x)=>a+Number(x.amount||0),0),out=DB.transactions.filter(x=>x.tx_type==='پرداخت').reduce((a,x)=>a+Number(x.amount||0),0);const activeOut=DB.checks_outgoing.filter(x=>x.status==='فعال').reduce((a,x)=>a+Number(x.amount||0),0),activeIn=DB.checks_received.filter(x=>x.status==='فعال').reduce((a,x)=>a+Number(x.amount||0),0);shell(`<h1>گزارش‌ها</h1><div class="cards"><div class="card"><div class="label">خالص دریافت منهای پرداخت</div><div class="value">${money(inc-out)}</div></div><div class="card"><div class="label">چک صادره فعال</div><div class="value">${money(activeOut)}</div></div><div class="card"><div class="label">چک دریافتی فعال</div><div class="value">${money(activeIn)}</div></div></div><div class="panel" style="margin-top:16px"><h2>تراکنش‌ها به تفکیک نوع</h2>${table('reporttx',['نوع','مبلغ'],[['دریافت',money(inc)],['پرداخت',money(out)],['انتقال',money(DB.transactions.filter(x=>x.tx_type==='انتقال').reduce((a,x)=>a+Number(x.amount||0),0))]],null,{filters:false})}</div>`)}
function settings(){shell(`<h1>تنظیمات</h1><div class="panel"><h2>اتصال دیتابیس</h2><div class="notice">اتصال فعلی از فایل config.js خوانده می‌شود. اطلاعات مالی در localStorage ذخیره نمی‌شود. برای انتقال به کامپیوتر دیگر فقط سایت GitHub Pages را باز کنید و با همان حساب وارد شوید.</div><div class="form" style="margin-top:12px">${field('Supabase URL','cfg_url',C.SUPABASE_URL||'')}${field('Supabase Anon Key','cfg_key',C.SUPABASE_ANON_KEY||'')}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="showConfigHelp()">راهنمای تنظیم</button><button class="btn warn" onclick="location.reload()">بارگذاری مجدد</button></div></div><div class="panel"><h2>مدیریت حساب</h2><p class="status">ایمیل ورود: ${esc(session?.user?.email||'')}</p><button class="btn light" onclick="resetPassword()">ارسال لینک تغییر رمز</button></div>`)}
function showConfigHelp(){alert('مقدار Project URL و anon public key را از Supabase بردارید و در فایل config.js قرار دهید؛ سپس فایل را در GitHub Pages بارگذاری کنید. service_role key را هرگز قرار ندهید.')}
async function resetPassword(){const {error}=await client.auth.resetPasswordForEmail(session.user.email,{redirectTo:location.href});toast(error?error.message:'لینک تغییر رمز ارسال شد')}
async function init(){if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h1>نرم‌افزار آماده اتصال است</h1><p class="notice">ابتدا مقدار SUPABASE_URL و SUPABASE_ANON_KEY را در فایل config.js وارد کنید و سپس سایت را در GitHub Pages منتشر کنید.</p></div></div>';return}client=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);const {data}=await client.auth.getSession();session=data.session;client.auth.onAuthStateChange((_e,s)=>{session=s; if(session){loadAll().then(render).catch(e=>toast(e.message))}else render()});if(session){try{await loadAll()}catch(e){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h1>خطا در اتصال</h1><p class="notice">'+esc(e.message)+'</p></div></div>';return}}render()}
init();
</script>
</body>
</html>
