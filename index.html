<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--muted:#6b7280;--primary:#14532d;--primary2:#166534;--line:#e5e7eb;--danger:#b91c1c;--warning:#b45309;--shadow:0 8px 24px rgba(0,0,0,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#10251a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:800;line-height:1.6;margin-bottom:18px}.brand small{display:block;font-size:11px;color:#cbd5e1;font-weight:400}.nav button{width:100%;border:0;background:transparent;color:#dbeafe;text-align:right;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#1d4d30;color:#fff}.main{flex:1;padding:20px;min-width:0}.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}.topbar h1{margin:0;font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--primary);color:#fff}.btn.secondary{background:#475569}.btn.light{background:#e2e8f0;color:#111827}.btn.danger{background:var(--danger)}.btn.warning{background:var(--warning)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;min-width:130px}.toolbar input{flex:1}.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;text-align:right}th{background:#f1f5f9;position:sticky;top:0;z-index:1}tr:hover td{background:#fafafa}.empty{padding:30px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}
.chart{display:flex;gap:8px;align-items:end;height:190px;padding:12px;border:1px solid var(--line);border-radius:10px}.barbox{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:#166534;border-radius:6px 6px 0 0;min-height:2px}.barbox strong{display:block;font-size:10px;color:#334155;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{border:0;background:#e2e8f0;border-radius:50%;width:34px;height:34px}
.toast{position:fixed;bottom:18px;left:18px;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:20}.toast.show{display:block}
.small{font-size:11px;color:var(--muted)}.positive{color:#166534;font-weight:700}.negative{color:#b91c1c;font-weight:700}
@media(max-width:800px){.sidebar{width:72px;padding:10px}.brand{font-size:0}.brand:before{content:"د";font-size:24px}.brand small,.nav span{display:none}.nav button{text-align:center}.main{padding:12px}.grid2{grid-template-columns:1fr}}

function initSupabase(){

  sb.auth.getSession().then(({data})=>{ if(data.session){session=data.session; startApp()} else showLogin(); });

function showLogin(message=''){
 document.body.innerHTML=`<div class="loginWrap"><div class="loginCard"><div class="brand big">مدیریت مالی دادیلانه<small>ورود به سامانه آنلاین</small></div>

async function login(){
 const email=v('loginEmail'), password=v('loginPass'); if(!email||!password)return document.getElementById('loginMsg').textContent='ایمیل و رمز عبور را وارد کنید.';
 const {error}=await sb.auth.signInWithPassword({email,password}); if(error)document.getElementById('loginMsg').textContent=error.message;
}
async function startApp(){
 if(!document.getElementById('content')) location.reload();
 await loadRemoteDB(); setNav(); render();
}
async function loadRemoteDB(){
 try{
   const {data,error}=await sb.from('app_data').select('payload').eq('user_id',session.user.id).maybeSingle();
   if(error) throw error;
   if(data?.payload){ DB=data.payload; }
   else { DB=structuredClone(INITIAL); await saveDB(true); }
 }catch(e){ DB=structuredClone(INITIAL); toast('اطلاعات آنلاین هنوز آماده نیست؛ اطلاعات اولیه اکسل نمایش داده شد.'); console.error(e); }
}
async function saveDB(silent=false){
 if(!session){ if(!silent)toast('ابتدا وارد شوید'); return; }
 const {error}=await sb.from('app_data').upsert({user_id:session.user.id,payload:DB,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error){toast('ذخیره در سرور ناموفق بود');console.error(error);return false}
 if(!silent)toast('اطلاعات در سرور ذخیره شد'); return true;
}

let TABLE_SEQ=0, TABLE_STORE={};
function arrToTable(headers,rows,actions){
 const id='tbl_'+(++TABLE_SEQ);
 TABLE_STORE[id]={headers,rows,actions,sortCol:null,dir:1,query:'',filters:Array(headers.length).fill('')};
 return smartTableHTML(id);
}
function smartTableHTML(id){
 const t=TABLE_STORE[id]; let entries=t.rows.map((r,i)=>({r,i}));
 if(t.query) entries=entries.filter(o=>o.r.join(' ').toLowerCase().includes(t.query.toLowerCase()));
 entries=entries.filter(o=>t.filters.every((f,c)=>!f||String(o.r[c]??'').toLowerCase().includes(f.toLowerCase())));
 if(t.sortCol!==null) entries.sort((a,b)=>{
   const av=String(a.r[t.sortCol]??''), bv=String(b.r[t.sortCol]??'');
   const an=Number(av.replace(/[^\d.-]/g,'')), bn=Number(bv.replace(/[^\d.-]/g,''));
   const cmp=(av!==''&&bv!==''&&!Number.isNaN(an)&&!Number.isNaN(bn))?an-bn:av.localeCompare(bv,'fa',{numeric:true,sensitivity:'base'});
   return cmp*t.dir;
 });
 return `<div class="smartTable" id="${id}"><div class="tabletools"><input placeholder="جستجو در همه ستون‌ها..." value="${esc(t.query)}" oninput="tableQuery('${id}',this.value)"><span class="small">روی عنوان ستون برای Sort و زیر آن برای فیلتر کلیک کنید.</span></div>
 ${entries.length?`<div class="tablewrap"><table><thead><tr>${t.headers.map((h,c)=>`<th onclick="tableSort('${id}',${c})">${esc(h)} ${t.sortCol===c?(t.dir===1?'▲':'▼'):''}</th>`).join('')}${t.actions?'<th>عملیات</th>':''}</tr>
 <tr class="filterrow">${t.headers.map((_,c)=>`<th><input placeholder="فیلتر..." value="${esc(t.filters[c])}" onclick="event.stopPropagation()" oninput="tableColFilter('${id}',${c},this.value)"></th>`).join('')}${t.actions?'<th></th>':''}</tr></thead><tbody>
 ${entries.map(o=>`<tr>${o.r.map(v=>`<td>${esc(v)}</td>`).join('')}${t.actions?`<td>${t.actions(o.i)}</td>`:''}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">رکوردی وجود ندارد</div>`}</div>`;
}
function tableQuery(id,q){TABLE_STORE[id].query=q; document.getElementById(id).outerHTML=smartTableHTML(id)}
function tableSort(id,c){const t=TABLE_STORE[id];if(t.sortCol===c)t.dir*=-1;else{t.sortCol=c;t.dir=1}document.getElementById(id).outerHTML=smartTableHTML(id)}
function tableColFilter(id,c,q){TABLE_STORE[id].filters[c]=q;document.getElementById(id).outerHTML=smartTableHTML(id)}

function accountBalances(){

  const name=a[1], initial=(a[4]==='منفی-بستانکار'?-1:1)*Number(a[3]||0);

  DB.transactions.forEach(t=>{const amount=Number(t[3]||0);if(t[4]===name)b+=amount;if(t[5]===name)b-=amount});
  return {row:a,balance:b};
 });
}

function cabinet(){
 const types=DB.cabinet;document.getElementById('content').innerHTML=`<div class="grid2"><div class="panel"><h2>ضرایب کابینت</h2>${arrToTable(['نوع کابینت','ضریب'],types)}</div><div class="panel"><h2>محاسبه قیمت کابینت</h2><div id="cabRows"></div><button class="btn light" onclick="addCabRow()">+ ردیف</button><button class="btn" onclick="calcCab()">محاسبه</button><div id="cabTotal" style="margin-top:14px;font-size:18px;font-weight:800"></div></div></div>`;addCabRow();addCabRow();addCabRow();

function addCabRow(){const box=document.getElementById('cabRows');const i=box.children.length;const opts=DB.cabinet.map(x=>`<option value="${esc(x[0])}" data-coef="${x[1]}">${esc(x[0])}</option>`).join('');box.insertAdjacentHTML('beforeend',`<div class="form" style="margin-bottom:8px"><div class="field"><label>نوع</label><select class="cbtype" onchange="syncCoef(this)">${opts}</select></div>${field('طول (متر)','cb_len_'+i,0,'number')}<div class="field"><label>ضریب</label><input class="cbcoef" value="${DB.cabinet[0]?.[1]||0.6}" readonly></div>${field('قیمت هر متر','cb_price_'+i,0,'number')}<div class="field"><label>قیمت نهایی</label><input class="cbtotal" readonly value="0"></div></div>`)}
function syncCoef(sel){sel.closest('.form').querySelector('.cbcoef').value=sel.options[sel.selectedIndex].dataset.coef}
function calcCab(){let total=0;document.querySelectorAll('#cabRows .form').forEach(row=>{const l=Number(row.querySelector('input[id^="cb_len_"]').value||0),p=Number(row.querySelector('input[id^="cb_price_"]').value||0),c=Number(row.querySelector('.cbcoef').value||0),t=l*p*c;row.querySelector('.cbtotal').value=t;total+=t});document.getElementById('cabTotal').textContent='جمع کل: '+money(total)}

 document.getElementById('content').innerHTML=`<div class="grid2"><div class="panel"><div class="toolbar"><input id="gq" placeholder="جستجو گروه..." oninput="filterAbout()"><button class="btn" onclick="groupForm()">+ گروه</button></div><div id="groups"></div></div><div class="panel"><div class="toolbar"><input id="bq" placeholder="جستجو بابت..." oninput="filterAbout()"><button class="btn" onclick="aboutForm()">+ بابت</button></div><div id="abouts"></div></div></div>`;filterAbout();

function reports(){
 const months=DB.base.months.map(x=>x[1]);const out=months.map(m=>DB.outgoing.filter(x=>x[1]===m&&x[8]==='فعال').reduce((a,x)=>a+Number(x[2]||0),0));const inc=months.map(m=>DB.received.filter(x=>x[7]===m&&x[11]==='فعال').reduce((a,x)=>a+Number(x[8]||0),0));const max=Math.max(1,...out,...inc);
 document.getElementById('content').innerHTML=`<div class="panel"><h2>مقایسه چک فعال به تفکیک ماه</h2><div class="chart">${months.map((m,i)=>`<div class="barbox"><strong>${num(Math.round(out[i]/1e6))}م</strong><div class="bar" style="height:${Math.max(3,out[i]/max*135)}px"></div><span>${m}</span></div>`).join('')}</div><p class="small">مقدار بالای هر ستون، مبلغ چک صادرشده فعال بر حسب میلیون ریال است.</p></div>
 <div class="grid2"><div class="panel"><h2>خلاصه درآمد/هزینه</h2>${arrToTable(['شاخص','مبلغ'],[['دریافت',money(DB.transactions.filter(x=>x[1]==='دریافت').reduce((a,x)=>a+Number(x[3]||0),0))],['پرداخت',money(DB.transactions.filter(x=>x[1]==='پرداخت').reduce((a,x)=>a+Number(x[3]||0),0))],['انتقال',money(DB.transactions.filter(x=>x[1]==='انتقال').reduce((a,x)=>a+Number(x[3]||0),0))]])}</div><div class="panel"><h2>مانده حساب‌ها</h2>${arrToTable(['حساب','مانده'],accountBalances().sort((a,b)=>b.balance-a.balance).slice(0,20).map(x=>[x.row[1],money(x.balance)]))}</div></div>`;
}

 document.getElementById('content').innerHTML=`<div class="panel"><h2>اطلاعات پایه</h2><div class="grid2">${arrToTable(['کد','نوع حساب'],DB.base.accountTypes)}${arrToTable(['کد','نوع تراکنش'],DB.base.transactions)}${arrToTable(['کد','ماه'],DB.base.months)}${arrToTable(['کد','وضعیت چک'],DB.base.checkStatus)}</div></div><div class="panel"><h2>مدیریت داده</h2><p class="small">اطلاعات این نرم‌افزار در دیتابیس مرکزی Supabase ذخیره می‌شود و از هر رایانه‌ای که با همین حساب وارد شوید قابل دسترسی است.</p><button class="btn warning" onclick="resetDB()">بازنشانی به اطلاعات اولیه اکسل</button></div>`;
}
function v(id){return document.getElementById(id)?.value??''}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function backup(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='پشتیبان-مدیریت-مالی-دادیلانه.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{DB=JSON.parse(r.result);await saveDB();render();toast('بازیابی در سرور انجام شد')}catch(_){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f,'utf-8')}

async function resetDB(){if(confirm('اطلاعات فعلی این حساب با اطلاعات اولیه Excel جایگزین شود؟')){DB=structuredClone(INITIAL);await saveDB();render()}}
async function logout(){await sb.auth.signOut()}
initSupabase();
